[project]
name = "couchd"
version = "0.1.0"
description = "Background service for Couch, a remote-first TV launcher for Raspberry Pi 4."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "dbus-fast>=2.44,<3",
]

[project.scripts]
couchd = "couchd.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["couchd"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The mock BlueZ's string annotations are D-Bus signatures ("b", "a{sv}"), read by dbus-fast.
"tests/test_bluez_dbus.py" = ["F821", "F722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

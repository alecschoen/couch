# Couch: installed by install.sh as /etc/pipewire/pipewire.conf.d/50-couch.conf, and
# system/pipewire-pulse-couch.conf goes with it.
#
# The smallest buffer PipeWire runs the sound at: 1024 samples, 21 ms. Its own minimum is 32,
# and a stream that asks for less latency gets it: the launcher's UI-sound stream asks for
# 10 ms, which PipeWire rounds down to 256 samples (5 ms), and as long as it's open the
# whole output runs at that, Plex and YouTube included. The Pi's headphone jack doesn't keep
# up at 5 ms: on the Pi, pw-top counted 225 dropouts (ERR, each one a click) in 40 minutes.
# Nothing here needs less than 21 ms: Kodi and Chromium allow for the latency PipeWire reports.
context.properties = {
    default.clock.min-quantum = 1024
}

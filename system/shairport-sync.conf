// Couch's AirPlay receiver (#80): installed as /opt/couch/share/shairport-sync.conf and run
// by couch-airplay.service. The package's /etc/shairport-sync.conf is left alone and unused.
// Every setting is described in shairport-sync's sample config
// (/usr/share/doc/shairport-sync/examples/).
general =
{
	name = "Couch";
	output_backend = "pa";
	// No password: anyone on the network can play to Couch, as with any speaker.
	// The phone's volume applies on top of Couch's own (the TV remote's).
	ignore_volume_control = "no";
	// D-Bus and MPRIS on the couch user's session bus, out of the system bus's way. couchd
	// doesn't use them: it reads the metadata pipe.
	dbus_service_bus = "session";
	mpris_service_bus = "session";
};

sessioncontrol =
{
	// A second phone can take over from the first, as with any AirPlay speaker.
	allow_session_interruption = "yes";
	// Free again soon after a phone goes away without saying so.
	session_timeout = 20;
};

pa =
{
	application_name = "AirPlay";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	// couchd keeps the picture in memory; nothing goes on the SD card.
	cover_art_cache_directory = "";
	pipe_name = "/run/couch-speaker/airplay-metadata";
	pipe_timeout = 5000;
};

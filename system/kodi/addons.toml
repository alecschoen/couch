# Kodi addons for Plex (#22), pinned by version and sha256. install.sh installs exactly these
# and nothing ever updates them: no repository addon is installed, Kodi's own addon updates
# are off, and so is PM4K's update check. To move to a new version, change it here.
#
# PM4K (script.plexmod) is pannal's release 1.3.19 (github.com/pannal/plex-for-kodi, tag
# 1.3.19, commit 0c589685). That release has no zip of its own; the packaged zip is the one in
# pannal's "Don't Panic" Kodi repository (pm4k.eu hands out repository.dontpanic, which points
# at GitHub), fetched here at a fixed commit. Its files are the tag's, minus git metadata, plus
# five CA certificates for plexnet. Its dependencies come from Kodi's official Omega repository.

[[addon]]
id = "script.plexmod"
version = "1.3.19"
url = "https://raw.githubusercontent.com/pannal/dontpanickodi/eba134ac09bfe4916b3511d1e377bf6bb03a947e/omega/zips/script.plexmod/script.plexmod-1.3.19.zip"
sha256 = "885b48b724a525a1412df09db8c69f4ec0eebb6da06d6e0509df097b3ac19816"


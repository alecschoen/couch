# swayimg's config for the session's splash (system/couch-session-start, #23): installed as
# /opt/couch/share/swayimg/config, and only that swayimg reads it (XDG_CONFIG_HOME).
#
# One still frame, the size of the screen, drawn pixel for pixel on the night ground, with
# no text over it. Every default key and mouse binding of swayimg 3.8 (Debian Trixie) is
# unbound: swayimg has the keyboard until Chromium's window maps, and a remote press then
# mustn't zoom, move or close the splash.

[general]
mode = viewer
size = fullscreen
decoration = no
app_id = couch-splash

[viewer]
window = #121214ff
transparency = #121214ff
scale = real
position = center
fixed = yes
slideshow = no

[info]
show = no

[keys.viewer]
F1 = none
Home = none
End = none
Prior = none

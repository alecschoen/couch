# Installed as /etc/systemd/system/systemd-rfkill.service.d/couch.conf (#31).
#
# systemd-rfkill puts back each radio's saved block at boot. On the Pi it reaches Wi-Fi
# while the chip is still starting; writing the block then hangs until the unit's 90 s
# timeout and the unit fails. Without a saved state for a radio it leaves that radio alone,
# so the Wi-Fi one is removed before every start. Bluetooth's is kept and still restored.
# Wi-Fi off is put back later in the boot by couch-wifi-boot, from NetworkManager's state.
[Service]
ExecStartPre=-/bin/sh -c 'rm -f /var/lib/systemd/rfkill/*:wlan'

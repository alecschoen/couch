# Couch: installed by install.sh as /etc/wireplumber/wireplumber.conf.d/50-couch.conf.
#
# couchd decides where sound goes (couchd/audio.py) and moves every playing stream when it
# switches. WirePlumber would otherwise remember each app's last output and send the app
# back there the next time it plays, even after couchd has moved everything elsewhere.
wireplumber.settings = {
  node.stream.restore-target = false
  # New streams, and ones nothing has moved, follow the default output. (The default.)
  linking.follow-default-target = true
}

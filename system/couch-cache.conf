# Couch (#25): the directories in /var/cache/couch, a tmpfs (var-cache-couch.mount), made at
# every boot. Installed as /etc/tmpfiles.d/couch-cache.conf.
d /var/cache/couch/chromium 0700 couch couch -
d /var/cache/couch/kodi     0700 couch couch -
# Plex's pictures for Home's Continue watching (couchd/plex.py), fetched again after a boot.
d /var/cache/couch/plex     0700 couch couch -

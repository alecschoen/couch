# Couch (#25): the journal lives in RAM (/run/log/journal) and starts over at every boot,
# so logging never writes to the SD card. A power cut can't leave a half-written journal
# behind, and the card wears less. The cost: `journalctl -b -1` has nothing after a reboot.
# Installed as /etc/systemd/journald.conf.d/50-couch.conf; `install.sh --revert-sd` removes it.
[Journal]
Storage=volatile
# A day of the TV's logs is a few MB; this caps what the journal can take from RAM.
RuntimeMaxUse=32M

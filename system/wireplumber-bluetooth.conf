# Couch: installed by install.sh as
# /var/lib/couch/.config/wireplumber/wireplumber.conf.d/51-couch-bluetooth.conf, so it applies
# to the couch user's WirePlumber only.
#
# WirePlumber normally runs Bluetooth audio only while its user has the active seat. On the
# TV, the screen moves between logind sessions (cage, Kodi), and each handoff leaves no
# active session for a moment. WirePlumber would stop Bluetooth then, and the speaker
# would drop and have to reconnect. The couch user is the only one on the seat, so keep it on.
# Only for couch: another user's WirePlumber (from an ssh login) has no seat, so it stays off
# Bluetooth, which is what we want.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

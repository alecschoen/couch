# Couch: installed by install.sh as /etc/pipewire/pipewire-pulse.conf.d/50-couch.conf.
#
# The same 21 ms floor as system/pipewire-couch.conf, for apps that go through pipewire-pulse
# (all of Couch's: the launcher, Chromium, Kodi). Its own minimum is 128 samples (2.7 ms).
pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.frag    = 1024/48000
    pulse.min.quantum = 1024/48000
}

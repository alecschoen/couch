<!doctype html>
<html lang="en" data-palette="system">
<head>
  <meta charset="utf-8">
  <title>Couch</title>
  <!--
    The launcher. Home is the first screen; the foundation demo's screens (console, kit, type)
    stay registered for poking at from devtools: couchApp.router.go("console").
  -->
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/bluetooth.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/screens/system.css">
</head>
<body>
  <div class="flood" id="flood"></div>
  <main class="screens" id="screens"></main>
  <div class="layer" id="layer"><div class="toasts" id="toasts"></div></div>

  <script type="module">
    import { createApp } from "./js/app.js";
    import { consoleScreen } from "./js/demo/console.js";
    import { foundationScreen } from "./js/demo/foundation.js";
    import { kitScreen } from "./js/demo/kit.js";
    import { typeScreen } from "./js/demo/type.js";
    import { bluetoothScreen } from "./js/screens/bluetooth.js";
    import { homeScreen } from "./js/screens/home.js";
    import { settingsScreen } from "./js/screens/settings.js";
    import { systemScreens } from "./js/screens/system.js";

    const app = createApp();
    app.router
      .register("home", homeScreen)
      .register("bluetooth", bluetoothScreen)
      .register("settings", settingsScreen)
      .register("foundation", foundationScreen)
      .register("console", consoleScreen)
      .register("kit", kitScreen)
      .register("type", typeScreen);
    window.couchApp = app; // for poking at it from devtools
    systemScreens(app); // Startup, Opening and errors: couchd decides. First, so Startup is frame one.
    app.start("home");
  </script>
</body>
</html>

[package]
name = "couch-launcher"
version = "0.1.0"
edition = "2024"
description = "Couch's launcher (Home, Settings, Bluetooth...) drawn natively with Slint"
license = "MIT"
publish = false

[features]
default = ["window"]
# A Wayland or X11 window: in cage on the Pi, on a desktop in dev mode
window = ["slint/backend-winit", "slint/unstable-winit-030", "dep:png"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
tungstenite = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = { version = "0.18", optional = true }
# UI sounds: libpulse-simple, loaded at runtime (src/sounds/output.rs)
libloading = "0.8"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
